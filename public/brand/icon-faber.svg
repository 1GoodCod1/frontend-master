<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="MasterHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- M-Network: main strokes -->
  <polyline points="96,400 96,208 192,96 256,208 320,96 416,208 416,400"
            fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="36"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base connector -->
  <line x1="96" y1="400" x2="416" y2="400"
        stroke="rgba(255,255,255,0.25)" stroke-width="16" stroke-linecap="round"/>

  <!-- Cross connectors (hub links) -->
  <line x1="192" y1="96" x2="320" y2="96"
        stroke="rgba(255,255,255,0.3)" stroke-width="12" stroke-linecap="round"/>
  <line x1="96" y1="208" x2="256" y2="208"
        stroke="rgba(255,255,255,0.15)" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="208" x2="416" y2="208"
        stroke="rgba(255,255,255,0.15)" stroke-width="12" stroke-linecap="round"/>

  <!-- Hub nodes -->
  <circle cx="96" cy="400" r="28" fill="white"/>
  <circle cx="416" cy="400" r="28" fill="white"/>
  <circle cx="192" cy="96" r="24" fill="white"/>
  <circle cx="320" cy="96" r="24" fill="white"/>
  <circle cx="96" cy="208" r="16" fill="rgba(255,255,255,0.5)"/>
  <circle cx="416" cy="208" r="16" fill="rgba(255,255,255,0.5)"/>

  <!-- Center hub node — orange accent -->
  <circle cx="256" cy="208" r="40" fill="#E97525" filter="url(#glow)"/>
  <circle cx="256" cy="208" r="20" fill="white" opacity="0.6"/>
</svg>
