<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="48" viewBox="0 0 280 48"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: teal rounded square -->
  <rect x="0" y="4" width="40" height="40" rx="9" fill="url(#iconGrad)"/>

  <!-- M-Network -->
  <polyline points="6,38 6,20 13,10 20,20 27,10 34,20 34,38"
            fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base connector -->
  <line x1="6" y1="38" x2="34" y2="38"
        stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Cross connectors -->
  <line x1="13" y1="10" x2="27" y2="10"
        stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>

  <!-- Hub nodes -->
  <circle cx="6" cy="38" r="2.2" fill="white"/>
  <circle cx="34" cy="38" r="2.2" fill="white"/>
  <circle cx="13" cy="10" r="1.8" fill="white"/>
  <circle cx="27" cy="10" r="1.8" fill="white"/>

  <!-- Center hub — orange accent -->
  <circle cx="20" cy="20" r="3" fill="#E97525" filter="url(#glow)"/>
  <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.6"/>

  <!-- Wordmark (dark background — white text) -->
  <text x="52" y="31"
        font-size="24"
        font-weight="700"
        fill="#FAFAFA"
        letter-spacing="-0.02em"
        font-family="Poppins, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">Fab<tspan fill="#2DD4BF">er</tspan></text>
</svg>
