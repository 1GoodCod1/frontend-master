<?xml version="1.0" encoding="UTF-8"?>
<svg width="260" height="48" viewBox="0 0 260 48"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E97525"/>
      <stop offset="100%" stop-color="#F08A3D"/>
    </linearGradient>
  </defs>

  <!-- Icon: brand-orange rounded square -->
  <rect x="0" y="4" width="40" height="40" rx="11" fill="url(#iconGrad)"/>

  <!-- M-House: letter M that doubles as a house silhouette -->
  <path d="M6,38 L6,22 L13,10 L20,22 L27,10 L34,22 L34,38 Z"
        fill="none" stroke="white" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark (dark background) -->
  <text x="52" y="31"
        font-size="24"
        font-weight="700"
        fill="#FAFAFA"
        letter-spacing="-0.02em"
        font-family="Poppins, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">Master<tspan fill="#2DD4BF">Hub</tspan></text>
</svg>
