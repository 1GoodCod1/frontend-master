# Dev: Vite listens on 3000 inside the container — map host:container as 3000:3000.
# Do NOT use 8080:80 here; that mapping is for production nginx only.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: master-hub-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./.env.docker:/app/.env:ro
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000}
      VITE_ENV: development  
      VITE_USE_HTTPONLY: "true"