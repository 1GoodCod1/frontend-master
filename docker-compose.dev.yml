services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: moldmasters-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
      - ./.env.docker:/app/.env:ro
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000}
      VITE_ENV: development  
      VITE_USE_HTTPONLY=true
      VITE_ID_ENCRYPTION_SECRET=cfd40de5886cbb0acb9955f4c0a940f4943b259e5c5e8268fd2b129608380453