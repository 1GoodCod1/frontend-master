<!doctype html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="hsl(40, 25%, 97%)" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/brand/icon-mh.svg" sizes="any" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180x180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Non-blocking font load: media="print" trick loads CSS async, then swaps to "all" -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Poppins:wght@400;500;600;700&display=swap"
    media="print"
    onload="this.media='all'" />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Poppins:wght@400;500;600;700&display=swap" />
  </noscript>
  <title>Master-Hub</title>
  <meta name="description" content="Master-Hub — piața specialiștilor verificați din Moldova. Găsiți meșteri pentru manichiură, reparații, curățenie, instalații sanitare, electricitate, construcții și multe altele." />
  <script>
    (function () {
      const STORAGE_KEY = 'mh_color_mode';
      let isDark = false;

      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored === 'dark') {
        isDark = true;
      } else if (stored === 'light') {
        isDark = false;
      } else {
        isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
  <style>
    html,
    body,
    #root {
      transition: background-color 0.2s ease;
    }

    html[data-theme="dark"] body,
    html[data-theme="dark"] #root {
      background-color: #000000;
    }

    html[data-theme="light"] body,
    html[data-theme="light"] #root {
      background-color: hsl(40 25% 97%);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <noscript>
    <div style="padding:2rem;text-align:center;font-family:system-ui,sans-serif;">
      <h1>Master-Hub</h1>
      <p>Please enable JavaScript to use this site.</p>
      <p><a href="/">Reload</a></p>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
