<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="hsl(40, 25%, 97%)" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/x-icon" href="/brand/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/brand/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <title>Masters Hub</title>
  <script>
    (function () {
      const STORAGE_KEY = 'mh_color_mode';
      let isDark = false;

      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored === 'dark') {
        isDark = true;
      } else if (stored === 'light') {
        isDark = false;
      } else {
        isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
  <style>
    html,
    body,
    #root {
      transition: background-color 0.2s ease;
    }

    html[data-theme="dark"] body,
    html[data-theme="dark"] #root {
      background-color: #000000;
    }

    html[data-theme="light"] body,
    html[data-theme="light"] #root {
      background-color: hsl(40 25% 97%);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
