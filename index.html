<!doctype html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="hsl(40, 25%, 97%)" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/brand/icon-faber.svg" sizes="any" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180x180.png" />

  <!-- LCP preload: hero image must start loading before JS executes -->
  <link rel="preload" as="image" href="/images/hero-masters-universal.webp" type="image/webp" fetchpriority="high" />

  <title>Faber</title>
  <meta name="description" content="Faber — piața specialiștilor verificați din Moldova. Căutați manichiură, reparații, curățenie, instalații, electricitate, climatizare, construcții, auto și altele. Meșteri în Chișinău, Bălți, Cahul și în toată țara — cu recenzii și contact rapid." />
  <script>
    (function () {
      const STORAGE_KEY = 'faber_color_mode';
      let isDark = false;

      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored === 'dark') {
        isDark = true;
      } else if (stored === 'light') {
        isDark = false;
      } else {
        isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
  <style>
    html,
    body,
    #root {
      transition: background-color 0.2s ease;
    }

    html[data-theme="dark"] body,
    html[data-theme="dark"] #root {
      background-color: #000000;
    }

    html[data-theme="light"] body,
    html[data-theme="light"] #root {
      background-color: hsl(40 25% 97%);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <noscript>
    <div style="padding:2rem;text-align:center;font-family:system-ui,sans-serif;">
      <h1>faber.md</h1>
      <p>Please enable JavaScript to use this site.</p>
      <p><a href="/">Reload</a></p>
    </div>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
