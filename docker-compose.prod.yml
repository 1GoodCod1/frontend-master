# Prod: nginx listens on 80 inside the container — host 8080 -> container 80.
# This file does not run Vite; use docker-compose.dev.yml for `npm run dev` on port 3000.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.faber.md}
        VITE_WS_URL: ${VITE_WS_URL:-wss://api.faber.md}
        VITE_ENV: production
    container_name: fabermd-frontend-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3